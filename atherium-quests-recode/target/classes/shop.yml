menu_title: "<gradient:#FFD700:#FFA500>Магазин квестов</gradient>"
size: 27 # Настраивается

items:
  # Предмет фермера - уровень 1
  stone:
    slot: 0
    material: "STONE"
    amount: 1
    display_name: "§fКамень"
    lore:
      - "§7Обычный камень"
      - ""
      - "§eЦена: §61 монета за 1 шт"
      - "§aДоступно: §f%available%§7/§f%max%"
      - "§7Обновление через: §e%timer%"
