  fermer:
    slot: 11
    material: "WHEAT"
    display_name: "<gradient:#00FF00:#00FFFF>§lФермер</gradient>"
    lore:
      - "§7Квесты связанные с фермерством"
      - "§7и сельским хозяйством"
      - ""
