# /fermer/quests/level_1.yml

quests:
  # ════════════════════════════════════════
  #  Квест 1: Посадка картофеля
  # ════════════════════════════════════════
  quest_1:
    # Тип квеста
    type: "plant_blocks"
    material: "POTATO"
    amount: 5

    # Награды (DeluxeMenus синтаксис)
    reward_commands:
      - "[console] give %player% diamond 1"
      - "[console] eco give %player% 100"
      - "[message] <gradient:#00FF00:#00FFFF>Вы выполнили квест!</gradient>"
      - "[message] §aПолучено: §f1x Алмаз, §6100 монет"
      - "[sound] ENTITY_PLAYER_LEVELUP-1.0-1.0"
      - "[actionbar] <#FFD700>+100 монет | +1 Алмаз"
      - "[particle] VILLAGER_HAPPY-10-0.5-1.0-0.5"

    # Отображение квеста (активный)
    display_name: "<gradient:#00FF00:#00FFFF>Посадить картофель</gradient>"
    lore:
      - "§7Посадите §e5 картофеля"
      - "§7на своей ферме"
      - ""
      - "§eПрогресс: §f%atherium_quest_progress_1%§7/§f5"
      - ""
      - "§eНаграда:"
      - "§7  ▸ 1x §bАлмаз"
      - "§7  ▸ §6100 монет"
      - ""
      - "§a§l▸ Активный квест"
    material: "POTATO"
    enchanted: true

    # Отображение квеста (выполненный)
    completed_display_name: "§a✓ Посадить картофель"
    completed_lore:
      - "§aВыполнено!"
      - "§7Вы получили награду"
      - ""
      - "§7Награда:"
      - "§7  ▸ 1x §bАлмаз"
      - "§7  ▸ §6100 монет"
    completed_material: "POTATO"
    completed_enchanted: false

    # Отображение квеста (заблокированный)
    locked_display_name: "§c✘ Заблокировано"
    locked_lore:
      - "§cСначала выполните"
      - "§cпредыдущий квест!"
    locked_material: "BARRIER"
    locked_enchanted: false

