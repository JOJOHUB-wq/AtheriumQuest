      - "§7с полей"
      - ""
      - "§eПрогресс: §f%atherium_quest_progress_2%§7/§f64"
      - ""
      - "§eНаграда:"
      - "§7  ▸ 5x §2Изумруд"
      - "§7  ▸ §6250 монет"
