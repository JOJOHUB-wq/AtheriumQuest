      - "[console] eco give %player% 250"
      - "[title] <gradient:#FFD700:#FFA500>Квест выполнен!</gradient>;&aПолучено 5 изумрудов"
      - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP-1.0-1.2"
      - "[message] §aВы получили §25 изумрудов §aи §6250 монет§a!"

    display_name: "<gradient:#FFD700:#FFA500>Собрать пшеницу</gradient>"
